name: Publish stable release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python publishing/check_repository.py
      - run: python publishing/build_release.py
      - name: Validate complete offline runtime
        shell: pwsh
        run: |
          & './dist/stage/role-showcase-remix/tools/windows-x64/python/python.exe' -X utf8 './dist/stage/role-showcase-remix/scripts/remix.py' doctor --full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run packaged cache and production regressions
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'dist/stage/role-showcase-remix'
          $env:REMIX_CACHE_TEST_SCRATCH = Join-Path $env:RUNNER_TEMP 'remix-cache-tests'
          Push-Location (Join-Path $packageRoot 'scripts')
          try {
            $runtime = Join-Path $packageRoot 'tools/windows-x64/python/python.exe'
            foreach ($test in @('test_performance_cache.py','test_asset_ops.py','test_planner_ops.py','test_render_ops.py','test_cli_e2e.py','test_automation_ops.py')) {
              & $runtime -X utf8 $test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally { Pop-Location }
      - name: Publish immutable stable version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package-manifest.json -Raw | ConvertFrom-Json).version
          $releaseNotes = "publishing/release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) { throw "Explicit release notes required: $releaseNotes" }
          gh release create "v$version" "dist/role-showcase-remix-v$version-windows-x64.zip" "dist/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "混剪技能 v$version · Windows x64 完整包" --notes-file $releaseNotes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
